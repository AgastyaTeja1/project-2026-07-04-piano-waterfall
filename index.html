<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano Waterfall — MIDI Visualizer</title>
  <meta name="description" content="Beautiful MIDI visualizer with cascading neon waterfalls of falling notes synced to an interactive piano keyboard" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>" />
  <style>
    /* ============ RESET & BASE ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a1a;
      --surface: rgba(255,255,255,0.06);
      --surface-border: rgba(255,255,255,0.12);
      --accent: #c8b4ff;
      --text: #e8e8ff;
      --text-muted: rgba(232,232,255,0.5);
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --radius: 12px;
      --header-h: 56px;
      --footer-h: 68px;
      --sidebar-w: 220px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }

    /* ============ GLASSMORPHISM ============ */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border: 1px solid var(--surface-border);
    }

    /* ============ LAYOUT ============ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-bottom: 1px solid var(--surface-border);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .brand-icon { font-size: 22px; }

    .brand-title {
      background: linear-gradient(135deg, #c8b4ff, #6ef0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .main-area {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ============ SIDEBAR ============ */
    .song-list {
      width: var(--sidebar-w);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 12px;
      border-right: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-list::-webkit-scrollbar { width: 4px; }
    .song-list::-webkit-scrollbar-track { background: transparent; }
    .song-list::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }

    .sidebar-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      padding: 4px 0 2px;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--surface-border);
      margin: 4px 0;
    }

    .songs { list-style: none; display: flex; flex-direction: column; gap: 2px; }

    .song-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .song-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--surface-border);
    }

    .song-item.active {
      background: rgba(200,180,255,0.15);
      border-color: rgba(200,180,255,0.35);
    }

    .song-item-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .song-item.active .song-item-name { color: var(--accent); }

    .song-item-composer {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ============ SETTINGS ============ */
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-row label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      border-radius: 2px;
      background: var(--surface-border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 0 8px rgba(200,180,255,0.5);
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .slider-wrap span {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 32px;
      text-align: right;
    }

    /* ============ VIZ SECTION ============ */
    .viz-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .song-info {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 16px 4px;
      flex-shrink: 0;
    }

    .song-name {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #c8b4ff, #6ef0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .song-composer {
      font-size: 12px;
      color: var(--text-muted);
    }

    #viz-canvas {
      flex: 1;
      width: 100%;
      display: block;
    }

    #piano-canvas {
      width: 100%;
      display: block;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ============ PLAYBAR ============ */
    .playbar {
      height: var(--footer-h);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-top: 1px solid var(--surface-border);
      flex-shrink: 0;
    }

    .playbar-left, .playbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #c8b4ff, #6ef0ff);
      color: #0a0a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 0 20px rgba(200,180,255,0.4);
    }

    .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 28px rgba(200,180,255,0.6); }
    .btn-play:active { transform: scale(0.97); }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

    .btn-outline {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ============ PROGRESS BAR ============ */
    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 32px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--surface-border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      transition: height 0.15s;
    }

    .progress-bar:hover { height: 6px; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8b4ff, #6ef0ff);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .progress-handle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(200,180,255,0.7);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .progress-bar:hover .progress-handle { opacity: 1; }

    .note-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ============ THEME PILLS ============ */
    .theme-pills { display: flex; gap: 4px; }

    .theme-pill {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--surface-border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .theme-pill:hover { border-color: var(--accent); color: var(--accent); }

    .theme-pill.active {
      background: linear-gradient(135deg, rgba(200,180,255,0.2), rgba(110,240,255,0.2));
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: calc(var(--footer-h) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,50,0.95);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,100,100,0.4); color: #ff8080; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 600px) {
      :root { --sidebar-w: 0px; }
      .song-list { display: none; }
      .theme-pills { display: none; }
      .header-controls { gap: 4px; }
    }

    /* ============ SCROLLBAR ============ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* ============ SKELETON LOADER ============ */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
